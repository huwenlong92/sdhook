# SDHook Nginx reverse proxy example.
#
# Replace:
# - sdhook.sdkit.cn with your domain.
# - /etc/nginx/ssl/cf.pem and /etc/nginx/ssl/cf.key with your cert files.
# - 127.0.0.1:9800 with the local SDHook listen address.
#
# This file is intended to be included from nginx http context, for example:
# - /etc/nginx/conf.d/sdhook.conf
# - /etc/nginx/sites-enabled/sdhook.conf on Debian/Ubuntu

map $http_cf_connecting_ip $sdhook_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

upstream sdhook_backend {
    server 127.0.0.1:9800;
    keepalive 32;
}

server {
    listen 80;
    server_name sdhook.sdkit.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sdhook.sdkit.cn;

    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/ssl/cf.pem;
    ssl_certificate_key /etc/nginx/ssl/cf.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/sdhook.access.log;
    error_log  /var/log/nginx/sdhook.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /assets/ {
        proxy_pass http://sdhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sdhook_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE realtime deploy and rollback log stream.
    location = /api/project/logs/stream {
        proxy_pass http://sdhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sdhook_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Agent heartbeat, long polling, and job reports.
    location /agent/ {
        proxy_pass http://sdhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sdhook_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://sdhook_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sdhook_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_redirect off;
    }
}
